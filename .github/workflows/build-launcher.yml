name: Build NEWGEN Launcher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Verify Generated APK
        run: |
          ls -la app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload Launcher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEWGEN-LAUNCHER-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: app/build/outputs/apk/release/app-release.apk
          tag_name: v1.0.0
          name: "NEWGEN Launcher v1.0.0"
          body: "Universal WebGL 3D Game Launcher for NEWGEN NEWS EGOISTS. Place game files in /sdcard/NEWGEN/game/index.html or /sdcard/NEWGEN/game.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
