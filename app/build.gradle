plugins {
    id 'com.android.application'
}

android {
    namespace 'org.newgen.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "org.newgen.launcher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure minimal native Android SDK - zero external overhead
}
